spring:
  application:
    name: GateWay
  data:
    redis:
      database: 2
      host: 127.0.0.1
      port: 59000
      password: ${REDIS_PASSWORD}
      timeout: 30000
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: localhost:18375
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 60000
            response-timeout: 60000
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:10010"
                  - "http://localhost:5173"
                  - "http://127.0.0.1:5173"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "DELETE"
                  - "PATCH"
                  - "OPTIONS"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 36000
          routes:
            - id: UserService
              uri: lb://UserService
              predicates:
                - Path=/api/user/**
            - id: OfflineDataService
              uri: lb://OfflineDataService
              predicates:
                - Path=/api/message/**
            - id: AiService
              uri: lb://AiService
              predicates:
                - Path=/api/ai/**
            - id: UserServiceContact
              uri: lb://UserService
              predicates:
                - Path=/api/contact/**
            - id: UserServiceGroup
              uri: lb://UserService
              predicates:
                - Path=/api/group/**

server:
  port: 10010