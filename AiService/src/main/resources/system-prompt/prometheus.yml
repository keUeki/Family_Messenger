# Prometheus configuration file
global:
  scrape_interval: 15s      # Global scrape interval
  evaluation_interval: 15s  # Rule evaluation interval

scrape_configs:
  # Prometheus monitoring itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']  # Reached by service name from inside the container

  # node_exporter monitoring
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Spring Boot application monitoring
  - job_name: 'ai-service'
    metrics_path: '/api/actuator/prometheus'  # Spring Boot Actuator endpoint
    static_configs:
      - targets: ['host.docker.internal:10010']  # The container reaching a service on the host
    scrape_interval: 10s  # Scrape every 10 seconds
    scrape_timeout: 10s   # Scrape timeout
