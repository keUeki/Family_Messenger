spring:
  application:
    name: UserService
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:49152/InfiniteChat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
  data:
    redis:
      database: 2
      host: 127.0.0.1
      port: 59000
      password: ${REDIS_PASSWORD}
      timeout: 30000
      lettuce:
        pool:
          # Minimum number of idle connections in the pool; defaults to 0
          min-idle: 4
          # Maximum number of idle connections in the pool; defaults to 8
          max-idle: 8
          # Maximum number of database connections in the pool; defaults to 8
          max-active: 8
          # Maximum time the pool will block waiting for a connection
          max-wait: 5000ms
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: true

  cloud:
    nacos:
      discovery:
        server-addr: localhost:18375


mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0


server:
  port: 8104


minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin

# Snowflake ID generator configuration
snowflake:
  workerId: 1
  datacenterId: 1