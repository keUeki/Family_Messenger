spring:
  application:
    name: RealTimeService
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:49152/InfiniteChat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
  data:
    redis:
      database: 2
      host: 127.0.0.1
      port: 59000
      password: ${REDIS_PASSWORD}
      timeout: 30000
  kafka:
    bootstrap-servers: localhost:9092  # Kafka bootstrap servers; separate multiple entries with commas
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: infinite-chat-push-group                # Consumer group id
      auto-offset-reset: earliest       # earliest / latest / none
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true          # Whether offsets are committed automatically
      auto-commit-interval: 1000        # Auto-commit interval in milliseconds
  cloud:
    nacos:
      discovery:
        server-addr: localhost:18375
        metadata:
          # Port the Netty WebSocket actually listens on; UserService hands it out as nettyUri
          netty-port: ${netty.port}



server:
  port: 8102

# Netty WebSocket server port (independent of Spring Boot's server.port)
netty:
  port: 9101

snowflake:
  workerId: 1
  datacenterId: 1