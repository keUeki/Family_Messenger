spring:
  application:
    name: RealTimeService
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:49152/InfiniteChat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
  data:
    redis:
      database: 2
      host: 127.0.0.1
      port: 59000
      password: ${REDIS_PASSWORD}
      timeout: 30000
  kafka:
    bootstrap-servers: localhost:9092  # Kafka 服务地址，多个用逗号分隔
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: infinite-chat-push-group-${random.uuid}   # 每个实例一个独立消费组，实现广播语义
      auto-offset-reset: latest          # 广播组每次启动都是新组，必须 latest，否则会重放全量历史消息
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true          # 是否自动提交 offset
      auto-commit-interval: 1000        # 自动提交间隔（毫秒）
  cloud:
    nacos:
      discovery:
        server-addr: localhost:18375



server:
  port: 8102

snowflake:
  workerId: 1
  datacenterId: 1